<style>
/* layout: header, one flexible stage that fills the screen, then caption + controls */
:root{--bg:#090e19;--panel:#101a2c;--line:#2a3b5e;--text:#e7eef9;--mute:#8fa2c2;--on:#22d3ee;--off:#f59e0b;--ok:#34d399;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding:10px 14px;max-width:1700px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline}
h1{margin:0;font-size:20px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.tabs button{background:#0c1424;color:var(--mute);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.tabs button.on{background:#0d2c35;border-color:var(--on);color:#fff}
.stage{flex:1;min-height:0;overflow:auto;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex}
svg{flex:1 0 auto;min-width:0;min-height:0;width:100%;height:100%}
.zm{position:sticky;top:4px;left:4px;z-index:2;display:flex;gap:4px;align-self:flex-start;margin-right:-104px}
.zm button{background:#0c1424cc;color:var(--text);border:1px solid var(--line);border-radius:6px;width:30px;height:28px;cursor:pointer;font-size:15px}
svg text{font-family:inherit}
.bot{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.cap h2{margin:0 0 3px;font-size:16px}
.cap p{margin:0;font-size:13.5px;line-height:1.45;color:#c9d4ea}
.cap .k{margin-top:5px;font-size:13px;color:var(--on);font-weight:700}
.ctl{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.ctl .r{display:flex;gap:6px}
.ctl button{background:#0c1424;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer}
.ctl button:hover:not(:disabled){border-color:var(--on)}
.ctl button:disabled{opacity:.4;cursor:default}
.ctl button.on{background:#0d2c35;border-color:var(--on)}
button:focus-visible{outline:2px solid var(--on);outline-offset:2px}
@media(max-width:760px){.bot{grid-template-columns:1fr}.ctl .r{flex-wrap:wrap}h1{font-size:17px}.tabs{margin-left:0}}
