<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PCIe Hardware Diagrams</title>
<style>
/* layout: toolbar on top, one full-height pannable stage below */
:root{--bg:#090e19;--panel:#101a2c;--line:#2a3b5e;--text:#e7eef9;--mute:#8fa2c2;--accent:#22d3ee;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .sp{flex:1}
button{background:#0c1424;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:#0d2c35;border-color:var(--accent);color:#fff}
.zl{min-width:52px;text-align:center;color:var(--mute);font-variant-numeric:tabular-nums;font-size:14px}
.stage{position:relative;flex:1;overflow:hidden;touch-action:none;cursor:grab}
.stage.drag{cursor:grabbing}
.layer{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.layer svg{display:block;width:100%;height:100%}
.hint{padding:6px 16px;font-size:12.5px;color:var(--mute);background:var(--panel);border-top:1px solid var(--line)}
</style></head><body>
<div class="app">
<div class="bar">
<button id="t0" class="on">Device, slot, Lanes and Link</button>
<button id="t1">Many Links (diagram)</button>
<button id="t2">Motherboard with six Links</button>
<span class="sp"></span>
<button id="zo" aria-label="Zoom out">&minus;</button><span class="zl" id="zl">100%</span><button id="zi" aria-label="Zoom in">+</button>
<button id="fit">Fit</button><button id="one">100%</button>
</div>
<div class="stage" id="stage"><div class="layer" id="layer"></div></div>
<div class="hint">Scroll or pinch to zoom. Drag to move. Double-click to zoom in on a spot.</div>
</div>

<script>
const dims=[[1800,1120],[1800,1000],[1800,1100]];
const st=document.getElementById('stage'),ly=document.getElementById('layer'),zl=document.getElementById('zl');
let cur=0,k=1,tx=0,ty=0,moved=false;
function apply(){ly.style.transform=`translate(${tx}px,${ty}px) scale(${k})`;zl.textContent=Math.round(k*100)+'%'}
var fitting=false;function fit(){fitting=true;moved=false;const [w,h]=dims[cur];const r=st.getBoundingClientRect();k=Math.min(r.width/w,r.height/h);tx=(r.width-w*k)/2;ty=(r.height-h*k)/2;apply();fitting=false}
function load(i){cur=i;const [w,h]=dims[i];ly.style.width=w+'px';ly.style.height=h+'px';
ly.innerHTML='';ly.appendChild(document.getElementById('d'+i).content.cloneNode(true));
[0,1,2].forEach(j=>document.getElementById('t'+j).classList.toggle('on',i==j));fit()}
function zoomAt(f,cx,cy){moved=true;const nk=Math.max(.2,Math.min(8,k*f));f=nk/k;tx=cx-(cx-tx)*f;ty=cy-(cy-ty)*f;k=nk;apply()}
function center(){const r=st.getBoundingClientRect();return [r.width/2,r.height/2]}
st.addEventListener('wheel',e=>{e.preventDefault();const r=st.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
st.addEventListener('dblclick',e=>{const r=st.getBoundingClientRect();zoomAt(1.8,e.clientX-r.left,e.clientY-r.top)});
const pts=new Map();let lastD=0;
st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);st.classList.add('drag');lastD=0});
st.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);
if(pts.size==1){moved=true;tx+=e.clientX-p[0];ty+=e.clientY-p[1];pts.set(e.pointerId,[e.clientX,e.clientY]);apply()}
else{pts.set(e.pointerId,[e.clientX,e.clientY]);const v=[...pts.values()];const d=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]);
if(lastD){const r=st.getBoundingClientRect();zoomAt(d/lastD,(v[0][0]+v[1][0])/2-r.left,(v[0][1]+v[1][1])/2-r.top)}lastD=d}});
const up=e=>{pts.delete(e.pointerId);lastD=0;if(!pts.size)st.classList.remove('drag')};
st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
document.getElementById('zi').onclick=()=>{const c=center();zoomAt(1.3,c[0],c[1])};
document.getElementById('zo').onclick=()=>{const c=center();zoomAt(1/1.3,c[0],c[1])};
document.getElementById('fit').onclick=fit;
document.getElementById('one').onclick=()=>{const c=center();zoomAt(1/k,c[0],c[1])};
[0,1,2].forEach(j=>document.getElementById('t'+j).onclick=()=>load(j));
new ResizeObserver(()=>{if(!moved)fit()}).observe(st);load(0);
</script></body></html>
